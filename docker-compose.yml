# Yerelde e-posta denemek için Mailpit: tüm postaları yakalar, göndermez.
#   docker compose up -d
#   → SMTP: 127.0.0.1:1025 (kimlik doğrulaması yok, TLS yok)
#   → Web arayüzü: http://localhost:8025
#
# .env dosyasında şu satırları aç:
#   SMTP_HOST=127.0.0.1
#   SMTP_PORT=1025
#   SMTP_SECURE=false
#   SMTP_FROM=krypt@localhost
services:
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: krypt-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web arayüzü
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 500
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mailpit-data:
